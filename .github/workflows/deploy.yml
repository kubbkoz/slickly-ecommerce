name: Build & ship .output → deploy branch

# Prečo: SLICKLY je ťažká Nuxt app a build padá na OOM na pamäťovo limitovanom
# HostCreators build kontajneri. Riešenie: build prebehne tu (dosť RAM) na
# node:24-alpine (musl — rovnaký runtime ako HostCreators, kvôli natívnym
# závislostiam ako sharp), a hotový self-contained Nitro `.output` sa pushne na
# vetvu `deploy`, ktorú HostCreators už len SPUSTÍ (žiadny build na hostingu).

on:
  push:
    branches:
      - claude/slickly-eshop-nuxt-0x2ri6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
    steps:
      - name: Install OS deps (git + build tools pre natívne moduly)
        run: apk add --no-cache git build-base python3 libc6-compat vips vips-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install (npm workspaces)
        run: npm install --no-audit --no-fund

      - name: Dedupe Vue — fixes intermittent SSR crash "Cannot redefine property"
        # Root cause of the intermittent first-load 500 (confirmed via
        # server/plugins/capture-last-error.ts on a live cold hit): npm workspace
        # hoisting left @vue/server-renderer with its OWN nested private copy of
        # vue → @vue/runtime-dom → @vue/runtime-core, separate from the copy the
        # rest of the SSR bundle uses. All three packages (slickly-store,
        # vue-starter-template, @vue/server-renderer's peerDependency) pin the
        # EXACT SAME "vue": "3.5.27" — there is no real version conflict, just an
        # unresolved hoist — so `npm dedupe` safely collapses the duplicate onto
        # the single shared copy (it only merges installs that are already
        # semver-compatible; it cannot silently change a resolved version).
        # When TWO physically different @vue/runtime-core instances coexist, a
        # component's compiled setup() (e.g. NuxtImg's useTemplateRef) and
        # @vue/server-renderer's own setupComponent() disagree about which
        # instance owns a given component's internal bookkeeping, and Vue's
        # Object.defineProperty call throws "Cannot redefine property: <ref>" —
        # fatal, uncaught, and only hit on an SSR render that actually
        # instantiates that code path fresh (hence "works after reload": once a
        # render succeeds, no further work happens on the same paths).
        run: npm dedupe --no-audit --no-fund

      - name: Build (.output cez root workspace skript)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Public Shopware config sa zapečie do .output v build-time
          # (nuxt.config číta process.env.NUXT_PUBLIC_* pri builde), aby artefakt
          # fungoval bez závislosti na runtime env hostingu. Sú to public hodnoty
          # (Store-API kľúč je exponovaný aj v prehliadači).
          NUXT_PUBLIC_SITE_URL: https://slickly.sk
          # Umožňuje /api/debug/version overiť, ktorý commit BEŽIACI proces na
          # HostCreators reálne servíruje — redeploy tam vyžaduje manuálny reštart
          # ("Spustiť aplikáciu"), ktorý sa ľahko vynechá bez viditeľnej chyby.
          NUXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NUXT_PUBLIC_BUILD_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          NUXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_id }}
          NUXT_PUBLIC_SHOPWARE_ENDPOINT: https://mtsport.store/store-api/
          NUXT_PUBLIC_SHOPWARE_ACCESS_TOKEN: SWSCZGT3TEJ3EHB1MVLXSHFWMG
          # Shopware IDs (z mtsport admina) — rieši 412 "language ID not a valid UUID"
          # a 400/404 prázdne category IDs na homepage.
          NUXT_PUBLIC_SW_ID_SALES_CHANNEL: 98432def39fc4624b33213a56b8c944d
          NUXT_PUBLIC_SW_ID_ROOT_CATEGORY: 019b07f4692872b3bab1d9ef5c022193
          NUXT_PUBLIC_SW_ID_LANG_SK: 019b07fc0d2f7a23b565cd7e42b0e5bc
          NUXT_PUBLIC_SW_ID_LANG_CZ: 2fbb5fe2e29a4d70aa5854ce7ce3e20b
          NUXT_PUBLIC_SW_ID_LANG_PL: 019b0806d86c71069f1c0d097c5b3638
          NUXT_PUBLIC_SW_ID_CURRENCY_EUR: b7d2554b0ce847cd82f3ac9bd1c0dfca
          NUXT_PUBLIC_SW_ID_CAT_HOME_SLIDER: 019c5d127e197abaaf054232dd7105a2
          NUXT_PUBLIC_SW_ID_CAT_FEATURED: 019cbe4cfcae7f7eb708b7b529a3562a
          NUXT_PUBLIC_SW_ID_CAT_FLASH_SALES: 019ed47a4c19746f8ab0a7bb6747dc2d
          # Shopware Admin API integrácia „MTSPORT Nuxt Frontend" (client_credentials).
          # Server-only privátny runtimeConfig (nuxt.config: shopwareAdmin*). Potrebné pre
          # badges (Admin `search/mtsport-badge`), returns, account, watchdog, store-hours…
          # Runtime env sa na HostCreators nedostane → musí sa zapiecť pri builde.
          SHOPWARE_ADMIN_ENDPOINT: https://mtsport.store/api/
          SHOPWARE_ADMIN_CLIENT_ID: SWIAUKWYTVBTVDDNCM50T204SA
          SHOPWARE_ADMIN_CLIENT_SECRET: ZnhYQ1dtRWFiWlFRd3l3UFNHb3VuMHlFczQ2UXZJejNXbDlEMTY

      - name: Fix Nitro output — doplň chýbajúci vue/server-renderer
        # Pri npm workspaces je `vue` hoistnuté do root node_modules a Nitro tracer
        # (nft) vynechá subpath `vue/server-renderer` → runtime ERR_MODULE_NOT_FOUND
        # → 500 na KAŽDOM requeste. Skopírujeme ho ručne (spoľahlivé).
        run: |
          SRC="$(node -p "require('node:path').dirname(require.resolve('vue/server-renderer'))" 2>/dev/null || echo node_modules/vue/server-renderer)"
          DST=slickly-store/.output/server/node_modules/vue/server-renderer
          rm -rf "$DST"
          mkdir -p "$(dirname "$DST")"
          cp -r "$SRC" "$DST"
          test -f "$DST/index.mjs" && echo "OK: vue/server-renderer doplnený z $SRC" || (echo "ZLYHALO" && exit 1)

      - name: Over, že v .output nezostala žiadna duplicitná kópia vue/runtime-core/runtime-dom
        # Safety net pre "npm dedupe" krok vyššie — kontroluje ŠPECIFICKY balíky
        # zapojené v pozorovanom crashi (vue, @vue/runtime-core, @vue/runtime-dom),
        # nie hocijaký vnorený node_modules — @vue/server-renderer legitímne
        # nestuje @vue/shared a @vue/compiler-ssr ako svoje reálne (neproblémové)
        # závislosti, tie nechceme false-positive zhodiť. Ak by CI hoisting aj
        # napriek dedupe nechal vnorenú kópiu vue/runtime-core/runtime-dom, build
        # zámerne ZLYHÁ tu namiesto toho, aby sa takýto artefakt nasadil a znovu
        # spôsobil "Cannot redefine property" 500 na produkcii.
        run: |
          OUT=slickly-store/.output/server/node_modules
          FOUND="$(find "$OUT/vue" "$OUT/@vue" -mindepth 2 -type d \( -name vue -o -name runtime-core -o -name runtime-dom \) -path "*/node_modules/*" 2>/dev/null)"
          if [ -n "$FOUND" ]; then
            echo "ZLYHALO: nájdená vnorená vue/runtime-core/runtime-dom kópia v .output (dual-package hazard):"
            echo "$FOUND"
            exit 1
          fi
          echo "OK: žiadna vnorená vue/runtime-core/runtime-dom kópia v .output — jedna zdieľaná inštancia."

      - name: Zostav deploy payload
        run: |
          rm -rf deploy-out
          mkdir -p deploy-out
          # -L = dereferencuj symlinky → .output je plne self-contained (žiadne
          # symlinky ako vue→.nitro/vue@x, ktoré by na HostCreators mohli dangle-núť).
          cp -rL slickly-store/.output deploy-out/.output
          cp slickly-store/.env.example deploy-out/.env.example 2>/dev/null || true
          printf '%s\n' '{' \
            '  "name": "slickly-deploy",' \
            '  "private": true,' \
            '  "type": "module",' \
            '  "scripts": { "start": "node .output/server/index.mjs" }' \
            '}' > deploy-out/package.json
          # POZOR: NEignoruj node_modules — .output/server/node_modules je
          # self-contained runtime a MUSÍ byť commitnutý. Ignoruj len tajomstvá.
          printf '%s\n' '.env' '.env.*' '!.env.example' > deploy-out/.gitignore

      - name: Push na vetvu deploy (force, jeden commit)
        run: |
          cd deploy-out
          git init -q
          git config user.email "ci@slickly.sk"
          git config user.name "slickly-ci"
          git checkout -q -b deploy
          git add -A
          git commit -q -m "Prebuilt .output from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy:deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
