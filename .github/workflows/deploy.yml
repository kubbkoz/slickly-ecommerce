name: Build & ship .output → deploy branch

# Prečo: SLICKLY je ťažká Nuxt app a build padá na OOM na pamäťovo limitovanom
# HostCreators build kontajneri. Riešenie: build prebehne tu (dosť RAM) na
# node:24-alpine (musl — rovnaký runtime ako HostCreators, kvôli natívnym
# závislostiam ako sharp), a hotový self-contained Nitro `.output` sa pushne na
# vetvu `deploy`, ktorú HostCreators už len SPUSTÍ (žiadny build na hostingu).

on:
  push:
    branches:
      - claude/slickly-eshop-nuxt-0x2ri6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
    steps:
      - name: Install OS deps (git + build tools pre natívne moduly)
        run: apk add --no-cache git build-base python3 libc6-compat vips vips-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install (npm workspaces)
        run: npm install --no-audit --no-fund

      - name: Build (.output cez root workspace skript)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Public Shopware config sa zapečie do .output v build-time
          # (nuxt.config číta process.env.NUXT_PUBLIC_* pri builde), aby artefakt
          # fungoval bez závislosti na runtime env hostingu. Sú to public hodnoty
          # (Store-API kľúč je exponovaný aj v prehliadači).
          NUXT_PUBLIC_SITE_URL: https://slickly.sk
          NUXT_PUBLIC_SHOPWARE_ENDPOINT: https://mtsport.store/store-api/
          NUXT_PUBLIC_SHOPWARE_ACCESS_TOKEN: SWSCZGT3TEJ3EHB1MVLXSHFWMG

      - name: Fix Nitro output — doplň chýbajúci vue/server-renderer
        # Pri npm workspaces je `vue` hoistnuté do root node_modules a Nitro tracer
        # (nft) vynechá subpath `vue/server-renderer` → runtime ERR_MODULE_NOT_FOUND
        # → 500 na KAŽDOM requeste. Skopírujeme ho ručne (spoľahlivé).
        run: |
          SRC="$(node -p "require('node:path').dirname(require.resolve('vue/server-renderer'))" 2>/dev/null || echo node_modules/vue/server-renderer)"
          DST=slickly-store/.output/server/node_modules/vue/server-renderer
          rm -rf "$DST"
          mkdir -p "$(dirname "$DST")"
          cp -r "$SRC" "$DST"
          test -f "$DST/index.mjs" && echo "OK: vue/server-renderer doplnený z $SRC" || (echo "ZLYHALO" && exit 1)

      - name: Zostav deploy payload
        run: |
          rm -rf deploy-out
          mkdir -p deploy-out
          cp -r slickly-store/.output deploy-out/.output
          cp slickly-store/.env.example deploy-out/.env.example 2>/dev/null || true
          printf '%s\n' '{' \
            '  "name": "slickly-deploy",' \
            '  "private": true,' \
            '  "type": "module",' \
            '  "scripts": { "start": "node .output/server/index.mjs" }' \
            '}' > deploy-out/package.json
          # POZOR: NEignoruj node_modules — .output/server/node_modules je
          # self-contained runtime a MUSÍ byť commitnutý. Ignoruj len tajomstvá.
          printf '%s\n' '.env' '.env.*' '!.env.example' > deploy-out/.gitignore

      - name: Push na vetvu deploy (force, jeden commit)
        run: |
          cd deploy-out
          git init -q
          git config user.email "ci@slickly.sk"
          git config user.name "slickly-ci"
          git checkout -q -b deploy
          git add -A
          git commit -q -m "Prebuilt .output from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy:deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
